# DISABLED: the talk-map scraper is turned off.
#
# The old pipeline (Jupyter + the unmaintained `getorg` package on deprecated
# action versions) fails on current GitHub runners. The talk map is not linked
# anywhere on the site, so this workflow is disabled rather than fixed.
#
# To re-enable: restore a `push:` trigger below and remove `if: ${{ false }}`
# from the job.

name: Scrape Talk Locations

on:
  workflow_dispatch:   # manual only; see note above

jobs:
  build:
    if: ${{ false }}   # hard-disabled
    runs-on: ubuntu-latest
    permissions:
      contents: write           # This workflow pushes to the repository

    steps:
    - uses: actions/checkout@v2

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'   # Specify the Python version you need

    - name: Install dependencies
      run: |
        pip install jupyter pandas requests beautifulsoup4 geopy  # Add other dependencies as needed
        pip install getorg --upgrade

    - name: Run Jupyter Notebook
      run: |
        jupyter nbconvert --to notebook --execute talkmap.ipynb --output talkmap_out.ipynb

    - name: Commit changes
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Automated update of talk locations" || echo "No changes to commit"
        git push
